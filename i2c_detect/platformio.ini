[platformio]
default_envs = pico2, esp32, gendrv

[env]
monitor_speed = 921600
build_flags =
    -I ../config

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
upload_protocol = picotool
upload_port = /dev/ttyACM0
build_flags =
    ${env.build_flags}
    -D PICO
    -D PICO2
    -D USE_PICO_CONFIG

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
upload_protocol = picotool
upload_port = /dev/ttyACM0
build_flags =
    ${env.build_flags}
    -D PICO
    -D USE_PICO_CONFIG

[env:esp32]
platform = espressif32
board = nodemcu-32s
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D USE_ESP32_CONFIG

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/ttyACM0
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT
    -D USE_ESP32S3_CONFIG

[env:gendrv]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -D USE_GENDRV_CONFIG
