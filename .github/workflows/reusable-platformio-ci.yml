name: Reusable PlatformIO CI

# Controls when this action will run.
on:
  workflow_call:
    inputs:
      ros_distro:
        description: 'ROS_DISTRO variable'
        required: true
        type: string

      os:
        description: 'Operating system for the runner'
        required: false
        default: 'ubuntu-24.04'
        type: string

      reference:
        description: 'Branch or tag of repo to checkout for build.'
        default: ''
        required: false
        type: string

jobs:
  # This job builds the diagnostics utilities and toolchains
  build-tools:
    name: Build Diagnostics & Tools on ROS ${{ inputs.ros_distro }}
    runs-on: ${{ inputs.os }}
    env:
      ROS_DISTRO: ${{ inputs.ros_distro }}

    steps:
      # Check out the repository
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.reference }}
          path: repo

      # Cache dependencies to speed up workflows
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install Python dependencies
        run: |
          pip install osrf_pycommon pyyaml

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ inputs.ros_distro }}

      - name: Install ROS 2 rmw
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-${{ inputs.ros_distro }}-rmw-cyclonedds-cpp ros-${{ inputs.ros_distro }}-rmw-fastrtps-cpp || true

      - name: Install environment
        uses: ./repo/.github/actions/platformio-env

      - name: Run Configuration Engine Tests
        run: |
          if [ -d "repo/tools/robot_config_engine" ]; then
            python3 -m unittest discover repo/tools/robot_config_engine
          fi

      - name: Build Calibration (test_acc)
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          export PATH=$PATH:~/.platformio/penv/bin
          if [ -d "repo/calibration" ]; then
            cd repo/calibration
            pio run
          fi

      - name: Build Sensor Diagnostics (test_sensors)
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          export PATH=$PATH:~/.platformio/penv/bin
          if [ -d "repo/test_sensors" ]; then
            cd repo/test_sensors
            pio run -e pico2 -e esp32 -e gendrv
          fi

      - name: Build Motor Diagnostics (test_motors)
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          export PATH=$PATH:~/.platformio/penv/bin
          if [ -d "repo/test_motors" ]; then
            cd repo/test_motors
            pio run -e pico2 -e esp32 -e gendrv
          fi

      - name: Build ADC Calibration (adc_calibrate)
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          export PATH=$PATH:~/.platformio/penv/bin
          if [ -d "repo/adc_calibrate" ]; then
            cd repo/adc_calibrate
            pio run -e esp32 -e gendrv
          fi
      - name: Build Driver, Kinematics & LiDAR Matrix (Plan A Dynamic Build Flags)
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          export PATH=$PATH:~/.platformio/penv/bin
          cd repo/firmware
          echo "== Matrix 1: ESP32 with MPU6050 + QMC5883L + Skid Steer + Generic 1-IN =="
          PLATFORMIO_BUILD_FLAGS="-D USE_MPU6050_IMU -D USE_QMC5883L_MAG -D LINO_BASE=SKID_STEER -D USE_GENERIC_1_IN_MOTOR_DRIVER" pio run -e esp32
          echo "== Matrix 2: Pico with GY85 + HMC5883L + Differential Drive + Generic 2-IN =="
          PLATFORMIO_BUILD_FLAGS="-D USE_GY85_IMU -D USE_HMC5883L_MAG -D LINO_BASE=DIFFERENTIAL_DRIVE -D USE_GENERIC_2_IN_MOTOR_DRIVER" pio run -e pico
          echo "== Matrix 3: Pico 2 with BNO085 + Mecanum + ESC Driver =="
          PLATFORMIO_BUILD_FLAGS="-D USE_BNO085_IMU -D LINO_BASE=MECANUM -D USE_ESC_MOTOR_DRIVER" pio run -e pico2
          echo "== Matrix 4: ESP32-S2 with MPU9150 + AK8975 + Skid Steer + BTS7960 =="
          PLATFORMIO_BUILD_FLAGS="-D USE_MPU9150_IMU -D USE_AK8975_MAG -D LINO_BASE=SKID_STEER -D USE_BTS7960_MOTOR_DRIVER" pio run -e esp32s2
          echo "== Matrix 5: ESP32-S3 with MPU9250 + AK8963 + Mecanum + Generic 2-IN =="
          PLATFORMIO_BUILD_FLAGS="-D USE_MPU9250_IMU -D USE_AK8963_MAG -D LINO_BASE=MECANUM -D USE_GENERIC_2_IN_MOTOR_DRIVER" pio run -e esp32s3
          echo "== Matrix 6: ESP32 WiFi with LiDAR UDP Forwarding =="
          PLATFORMIO_BUILD_FLAGS="-D USE_LIDAR_UDP" pio run -e esp32_wifi




  # This job parses the firmware/platformio.ini file
  pio-fw-matrix:
    name: Parse firmware/platformio.ini
    runs-on: ${{ inputs.os }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      # check out the repository
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.reference }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # run the python script to parse the platformio.ini file and output as json to a matrix
      # pass the ros distros desired as arguments
      - name: Parse platformio.ini
        id: set-matrix
        run: |
          echo "matrix=$(python .github/parse_platformio.py)" >> $GITHUB_OUTPUT


  # This job builds the firmware for each environment parsed from the platformio.ini file
  build-firmware:
    # require the pio-fw-matrix job to complete before running
    needs: pio-fw-matrix
    runs-on: ${{ inputs.os }}
    name: Build ${{ matrix.env }} firmware on ROS ${{ inputs.ros_distro }}
    strategy:
      # don't stop all jobs if one fails
      fail-fast: false
      # Build the firmware for each environment from parsing job in parallel, max 3 concurrent jobs
      max-parallel: 3
      matrix:
        include: ${{fromJson(needs.pio-fw-matrix.outputs.matrix)}}

    steps:
      # Check out the repository
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.reference }}
          path: repo

      # Cache dependencies to speed up workflows
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install Python dependencies
        run: |
          pip install osrf_pycommon pyyaml

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ inputs.ros_distro }}

      - name: Install ROS 2 rmw
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-${{ inputs.ros_distro }}-rmw-cyclonedds-cpp ros-${{ inputs.ros_distro }}-rmw-fastrtps-cpp || true

      - name: Install environment
        uses: ./repo/.github/actions/platformio-env
          
      # Build the firmware for each environment in parallel
      - name: Build Firmware
        env:
          ROS_DISTRO: ${{ inputs.ros_distro }}
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          export PATH=$PATH:~/.platformio/penv/bin
          cd repo/firmware
          pio run -e ${{ matrix.env }}
