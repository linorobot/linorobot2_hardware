name: ROS Humble Firmware Build

on:
  pull_request:
    # Run on PRs to humble, main, devel, and upstream-pr branches
    branches:
      - humble*
      - main
      - devel
      - 'upstream-pr/**'
    # Don't run when the following files are changed which don't affect firmware.
    paths-ignore:
      - 'docs/**'
      - .gitignore
      - LICENSE
      - README.md
  
  push:
    # Run on pushes to humble, main, devel, and upstream-pr branches
    branches:
      - humble*
      - main
      - devel
      - 'upstream-pr/**'
    # Don't run when the following files are changed which don't affect firmware.
    paths-ignore:
      - 'docs/**'
      - .gitignore
      - LICENSE
      - README.md
  
  # Run Fridays at midnight to detect flakiness and broken dependencies
  schedule:
    - cron: '0 0 * * FRI'

  # Allow manual triggering
  workflow_dispatch:


jobs:
  firmware:
    # The current file calls the firmware workflow with the following parameters
    uses: ./.github/workflows/reusable-platformio-ci.yml
    with:
      ros_distro: humble
      os: ubuntu-22.04
      # The reference field will be set to 'humble' only if the event that triggered the workflow is schedule. Otherwise, it will be left blank.
      reference: ${{ github.event_name == 'schedule' && 'humble' || '' }}
